<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Code Mentor</title>

    <link rel="stylesheet" href="popup.css">
</head>

<body>

    <header>
        <h1>🤖 AI Code Mentor</h1>
    </header>

    <main>

<div class="hero">

    <h2>
        AI Powered Coding Assistant
    </h2>

    <p>
        Analyze • Optimize • Learn
    </p>

</div>

 <div class="action-buttons">

    <button id="explain-btn">
        📖 Explain
    </button>

    <button id="bugs-btn">
        🐞 Bugs
    </button>

    <button id="optimize-btn">
        ⚡ Optimize
    </button>

    <button id="comments-btn">
        💬 Comments
    </button>

    <button id="translate-btn">
        🔄 Translate
    </button>

    <button id="complexity-btn">
        📊 Complexity
    </button>

    <button id="tests-btn" class="full-width">
        🧪 Unit Tests
    </button>

</div>

<div id="status-message" class="hidden"></div>

<div class="section-card">

    <h3>📄 Current Page</h3>

    <p class="label">Title</p>

    <p id="page-title">
        Loading...
    </p>

    <p class="label">URL</p>

    <p id="page-url">
        Loading...
    </p>
</div>

<div class="section-card">

    <h3>💻 Selected Code</h3>

    <pre id="selected-code">
    Nothing selected.
    </pre>

</div>

<div class="section-card">

    <button id="copy-btn">
    📋 Copy Result
    </button>
    
    <button id="download-btn">
    📥 Download Result
    </button>

    <h3>🤖 AI Result</h3>

    <div id="analysis-result" class="result-card">
    Waiting...
</div>

</div>


</main>

<footer>
    <p>Version 1.0.0</p>
</footer>

<script src="popup.js"></script>
</body>
</html>
