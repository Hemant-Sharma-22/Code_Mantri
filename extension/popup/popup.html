<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Code Mentor</title>

    <link rel="stylesheet" href="popup.css">
</head>

<body>

    <header>
        <h1>🤖 AI Code Mentor</h1>
    </header>

    <main>

    <p id="welcome-text">
        Welcome to AI Code Mentor
    </p>

    <p id="description">
        Analyze code from the current webpage.
    </p>

 <div class="action-buttons">

    <button id="explain-btn">
        📖 Explain Code
    </button>

    <button id="bugs-btn">
        🐞 Find Bugs
    </button>

    <button id="optimize-btn">
        ⚡ Optimize Code
    </button>

    <button id="comments-btn">
        💬 Generate Comments
    </button>

    <button id="translate-btn">
        🔄 Translate Code
    </button>

    <button id="complexity-btn">
    📊 Complexity Analysis
    </button>

    <button id="tests-btn">
    🧪 Generate Unit Tests
    </button>

</div>

    <div id="status-message" class="hidden"></div>

    <hr>

    <h3>Current Page</h3>

    <p>
        <strong>Title:</strong>
    </p>

    <p id="page-title">
        Loading...
    </p>

    <p>
        <strong>URL:</strong>
    </p>

    <p id="page-url">
        Loading...
    </p>
    <hr>

    <h3>Selected Code</h3>

    <pre id="selected-code">
     Nothing selected.
    </pre>

    <hr>

<h3>Analysis</h3>

<pre id="analysis-result">
Waiting...
</pre>

</main>

    <footer>
        <p>Version 1.0.0</p>
    </footer>

    <!-- <script src="popup.js"></script> -->

</body>

<script src="popup.js"></script>

</html>
